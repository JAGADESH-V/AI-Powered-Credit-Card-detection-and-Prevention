 
[project]
name = "fraudguard"
version = "1.0.0"
description = "Credit card fraud detection with explainable decisions"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",
  "B008",
  "N818",
  "N803",
  "N806",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "SIM115", "RUF059"]
"src/fraudguard/data/generate.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
 
[tool.vercel]
entrypoint = "fraudguard.src.fraudguard.api.app:app"


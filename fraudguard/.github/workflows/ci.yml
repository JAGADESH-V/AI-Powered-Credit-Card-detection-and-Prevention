name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new CVEs appear without any code changing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Train a model so serving tests have an artifact
        run: python scripts/train_model.py --cards 800 --days 60
      - name: Tests
        run: PYTHONPATH=src pytest tests/ -q
        env:
          FG_REDIS_URL: redis://localhost:6379/0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff mypy
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy src/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install bandit pip-audit
      - name: Static analysis of our own code
        run: bandit -r src/ -ll
      - name: Known CVEs in dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install scikit-learn pandas numpy joblib
      - run: python scripts/train_model.py --cards 500 --days 40
      - run: docker build -f deploy/Dockerfile -t fraudguard:ci .
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fraudguard:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
